name: Publish jevspin comparison once

on:
  push:
    branches: [feature/jevspin-compare-pages]
    paths:
      - .github/workflows/publish-jevspin-compare-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jevspin-compare-pages
          fetch-depth: 0

      - name: Download verified comparison bundle
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprnortheu.oaiusercontent.com/files/00000000-9f1c-81f4-b959-d964bfd1bef6/raw?se=2026-09-28T09%3A26%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=704363fc-5d90-5845-91f9-dc3f55a4cd13&skoid=7b771594-2b4f-4e93-93be-fdeeeb59aaf9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T06%3A34%3A25Z&ske=2026-09-29T06%3A34%3A25Z&sks=b&skv=2026-02-06&sig=g4TKaSKWWSlZePZytD6xwrLRJ0J2lpDO28MBReKhA4k%3D'
          curl -fsSL "$url" -o /tmp/jevspin.zip
          echo 'e4874b2d24f0e3cdce5156bebe2835f891e2bf677259699c4f6928b8f0fd9e28  /tmp/jevspin.zip' | sha256sum -c -
          rm -rf /tmp/jevspin-dist
          mkdir -p /tmp/jevspin-dist
          unzip -q /tmp/jevspin.zip -d /tmp/jevspin-dist
          test -f /tmp/jevspin-dist/index.html
          grep -R -q 'Same cube, three strategies' /tmp/jevspin-dist/assets

      - name: Preserve mobile graph visibility
        shell: python
        run: |
          from pathlib import Path
          p = Path("/tmp/jevspin-dist/index.html")
          s = p.read_text()
          marker = "</head>"
          style = """    <style>
              @media (max-width: 760px) {
                .stage {
                  height: auto !important;
                  min-height: 0 !important;
                  overflow: visible !important;
                  grid-template-rows: auto auto auto !important;
                }
                .viz-cube,
                .viz-graph {
                  min-height: 300px !important;
                }
                .viz-graph { margin-top: 8px; }
              }
            </style>
          """
          if marker not in s:
              raise SystemExit("missing head")
          p.write_text(s.replace(marker, style + marker))

      - name: Replace published bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf jevspin
          mkdir -p jevspin
          cp -a /tmp/jevspin-dist/. jevspin/
          rm -f .github/workflows/publish-jevspin-compare-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish jevspin comparison UI"
          git push origin HEAD:feature/jevspin-compare-pages
